name: CPBL access recovery diagnosis
on:
  push:
    branches: ['codex/cpbl-access-recovery']
    paths: ['.github/workflows/cpbl-access-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet beautifulsoup4 curl_cffi
      - name: Compare existing collector and browser TLS sessions
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, json, os, pathlib
          from datetime import datetime, timedelta, timezone
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from curl_cffi import requests
          spec = importlib.util.spec_from_file_location("cpbl", "refresh-cpbl.py")
          cpbl = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(cpbl)
          out = pathlib.Path("probe-output")
          out.mkdir(exist_ok=True)
          now = datetime.now(timezone(timedelta(hours=9)))
          prior = now.replace(day=1) - timedelta(days=1)
          print("OS", os.environ.get("RUNNER_OS"), "KST", now.isoformat(), flush=True)
          html, cookie = cpbl.curl_get(cpbl.ZH_URL)
          print("existing collector rows", len(cpbl.parse_rows(html, now.year)), flush=True)
          session = requests.Session(impersonate="chrome", headers={"Accept-Language": "zh-TW,zh;q=0.9,en;q=0.8"})
          responses = []
          def describe(label, res):
              soup = BeautifulSoup(res.text, "html.parser")
              rows = cpbl.parse_rows(res.text, now.year)
              print(label, "status", res.status_code, "URL", res.url, "bytes", len(res.content),
                    "title", soup.title.get_text() if soup.title else "-", "rows", len(rows),
                    "latest", max((r["date"] for r in rows), default="-"), flush=True)
              print("cookie names", list(session.cookies.keys()), flush=True)
              forms=[]
              for f in soup.find_all("form"):
                  fields=[e.get("name") for e in f.find_all(["input","select"]) if e.get("name")]
                  forms.append({"action":f.get("action"),"method":f.get("method"),"fields":fields})
              print("forms", forms, flush=True)
              for row in rows[:5]:
                  print(row, flush=True)
              (out/(label+".html")).write_text(res.text, encoding="utf-8")
              responses.append({"label":label,"status":res.status_code,"url":res.url,"forms":forms,"rows":rows})
              return soup
          for label, url in [
              ("home","https://www.cpbl.com.tw/"),
              ("movement","https://www.cpbl.com.tw/player/trans"),
              ("current-month",f"https://www.cpbl.com.tw/player/trans?year={now.year}&month={now.month}"),
              ("previous-month",f"https://www.cpbl.com.tw/player/trans?year={prior.year}&month={prior.month}")]:
              try:
                  res=session.get(url,timeout=25)
                  soup=describe(label,res)
                  if label=="movement" and res.status_code==200:
                      form=next((f for f in soup.find_all("form") if f.find("input",attrs={"name":"__RequestVerificationToken"}) and f.find(attrs={"name":"Year"})),None)
                      if form and form.get("method","get").lower()=="post":
                          payload={e["name"]:e.get("value","") for e in form.find_all("input",attrs={"name":True})}
                          payload.update({"Year":str(now.year),"Month":"","ClubNo":"","KindCode":"","Keyword":""})
                          action=urljoin(res.url,form.get("action") or res.url)
                          if action.startswith("https://www.cpbl.com.tw/player/trans"):
                              describe("year-form",session.post(action,data=payload,headers={"Referer":res.url},timeout=30))
              except Exception as e:
                  print(label,"ERROR",str(e),flush=True)
          (out/"results.json").write_text(json.dumps(responses,ensure_ascii=False,indent=2),encoding="utf-8")

          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpbl-source-${{ runner.os }}
          path: probe-output/
