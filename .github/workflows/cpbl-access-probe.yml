name: CPBL access recovery diagnosis
on:
  push:
    branches: ['codex/cpbl-access-recovery']
    paths: ['.github/workflows/cpbl-access-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet curl_cffi
      - name: Verify documented Reader POST API
        run: |
          python - <<'PY'
          import json, pathlib, re
          from curl_cffi import requests
          out=pathlib.Path("probe-output")
          out.mkdir(exist_ok=True)
          s=requests.Session(impersonate="chrome")
          headers={"X-No-Cache":"true","X-Respond-With":"html","Accept":"text/html"}
          cases=[
              ("reader-post-current","POST","https://r.jina.ai/",{"url":"https://www.cpbl.com.tw/player/trans?year=2026&month=10"}),
              ("reader-post-prior","POST","https://r.jina.ai/",{"url":"https://www.cpbl.com.tw/player/trans?year=2026&month=9"}),
              ("reader-http","GET","https://r.jina.ai/http://www.cpbl.com.tw/player/trans",None),
          ]
          for label,method,url,data in cases:
              try:
                  res=s.request(method,url,data=data,headers=headers,timeout=100)
                  print("SOURCE",label,"HTTP",res.status_code,"bytes",len(res.content),flush=True)
                  print("body",res.text[:8000],flush=True)
                  (out/(label+".html")).write_text(res.text,encoding="utf-8")
              except Exception as e:
                  print("SOURCE",label,"ERROR",str(e),flush=True)

          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpbl-reader-source
          path: probe-output/
