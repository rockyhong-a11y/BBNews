name: CPBL access recovery diagnosis
on:
  push:
    branches: ['codex/cpbl-access-recovery']
    paths: ['.github/workflows/cpbl-access-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet curl_cffi
      - name: Verify official source from an independent fetch network
        run: |
          python - <<'PY'
          import pathlib, re, time
          from curl_cffi import requests
          session=requests.Session(impersonate="chrome")
          out=pathlib.Path("probe-output")
          out.mkdir(exist_ok=True)
          urls=[
              ("robots","https://www.cpbl.com.tw/robots.txt"),
              ("reader-current","https://r.jina.ai/https://www.cpbl.com.tw/player/trans?year=2026&month=10"),
              ("reader-previous","https://r.jina.ai/https://www.cpbl.com.tw/player/trans?year=2026&month=9"),
          ]
          for label,url in urls:
              try:
                  res=session.get(url,headers={"X-No-Cache":"true","Accept":"text/plain"},timeout=90)
                  print("SOURCE",label,"HTTP",res.status_code,"bytes",len(res.content),"URL",res.url,flush=True)
                  print(res.text[:14000],flush=True)
                  (out/(label+".txt")).write_text(res.text,encoding="utf-8")
              except Exception as e:
                  print(label,"ERROR",str(e),flush=True)

          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpbl-reader-source
          path: probe-output/
