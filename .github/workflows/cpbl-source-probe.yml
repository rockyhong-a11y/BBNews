name: CPBL source diagnosis
on:
  push:
    paths:
      - '.github/workflows/cpbl-source-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet beautifulsoup4
      - name: Verify collection and cache preservation
        run: |
          python3 -m py_compile refresh-cpbl.py
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          cache = pathlib.Path("cpbl-cache.json")
          before = hashlib.sha256(cache.read_bytes()).hexdigest()
          res = subprocess.run([sys.executable, "refresh-cpbl.py"])
          after = hashlib.sha256(cache.read_bytes()).hexdigest()
          data = json.loads(cache.read_text())
          print("collector exit:", res.returncode, flush=True)
          print("cache unchanged:", before == after, flush=True)
          print("cache updated:", data["updated"], "rows:", len(data["rows"]),
                "latest:", max((r["date"] for r in data["rows"]), default="-"), flush=True)
          if res.returncode:
              assert before == after, "Failed collection modified the cache"
          else:
              assert data["rows"], "Successful collection produced no rows"
          PY
      - name: Commit a successful refresh if present
        run: |
          if ! git diff --quiet -- cpbl-cache.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add cpbl-cache.json
            git commit -m "CPBL cache refresh after source verification"
            git push
          fi
